[workspace]
members = ["core", "worker", "config"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.75"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = "allow"
cargo = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = true
# NOTE: `strip = true` (aka `strip = "symbols"`) also strips the wasm
# `target_features` section advertising `reference-types`, which makes
# wasm-bindgen >= 0.2.125 fail with
# "externref table required for catch wrappers"
# (cloudflare/workers-rs#1014). `strip = "debuginfo"` keeps the marker
# while still dropping debug info for size.
strip = "debuginfo"
codegen-units = 1
opt-level = "z"


