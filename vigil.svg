<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Vigil logo">
  <defs>
    <linearGradient id="shield" x1="112" y1="70" x2="410" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#263A59"/>
      <stop offset="1" stop-color="#14243D"/>
    </linearGradient>
    <linearGradient id="pulse" x1="150" y1="320" x2="365" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#28D89B"/>
      <stop offset="1" stop-color="#16B981"/>
    </linearGradient>
  </defs>

  <!-- Shield -->
  <path
    d="M256 42
       C309 76 357 92 410 104
       L410 225
       C410 331 351 417 256 468
       C161 417 102 331 102 225
       L102 104
       C155 92 203 76 256 42Z"
    fill="url(#shield)"/>

  <!-- Eye -->
  <path
    d="M142 238
       C171 191 211 167 256 167
       C301 167 341 191 370 238
       C341 285 301 309 256 309
       C211 309 171 285 142 238Z"
    fill="#fff"/>

  <!-- Iris -->
  <circle cx="256" cy="238" r="52" fill="#1C304D"/>
  <circle cx="272" cy="220" r="12" fill="#fff"/>

  <!-- Uptime pulse -->
  <path
    d="M151 357
       H205
       L222 357
       L238 330
       L258 383
       L281 315
       L304 373
       L320 345
       H361"
    fill="none"
    stroke="url(#pulse)"
    stroke-width="16"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Live/status indicator -->
  <circle cx="390" cy="117" r="25" fill="#20C997"/>
  <circle cx="390" cy="117" r="10" fill="#8FF3D1" opacity=".35"/>
</svg>
