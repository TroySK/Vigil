name: Deploy to Cloudflare

on:
  push:
    branches: ['main']
  workflow_dispatch:

# The deploy job only needs the checked-out source; secrets are passed
# explicitly per step. Keep the implicit GITHUB_TOKEN read-only.
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@899b013517f9e7774591216672bf75a46bb9a481 # v2
        with:
          tool: cargo-audit
      - name: Audit dependencies
        run: cargo audit

  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # Pin the CLI used by every deploy step; bump deliberately.
      WRANGLER_VERSION: "4.151.3"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run pure-logic tests
        run: cargo test -p vigil-core -p vigil -p vigil-worker

      - name: Check worker build
        run: cargo check -p vigil-worker --target wasm32-unknown-unknown

      - name: Use Node.js 22.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x

      # CLOUDFLARE_ACCOUNT_ID is mandatory: fail fast when it is missing
      # rather than attempting an account lookup via the API token.
      - name: Check required secrets
        run: |
          if [[ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]]; then
            echo "CLOUDFLARE_ACCOUNT_ID secret is required but not set!"
            exit 1
          fi
          if [[ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]]; then
            echo "CLOUDFLARE_API_TOKEN secret is required but not set!"
            exit 1
          fi

      # The config editor (EDITOR=true) takes the status site offline by
      # design: every route renders the editor and cron probes pause. It
      # must never reach production via a committed wrangler.toml — the
      # commented template (`# EDITOR = "true"`) does not trip this.
      - name: Refuse editor mode in production deploys
        run: |
          if grep -qE '^[[:space:]]*EDITOR[[:space:]]*=' worker/wrangler.toml; then
            echo "EDITOR is set in worker/wrangler.toml — remove it before deploying (editor mode disables the site)."
            exit 1
          fi

      # The repo ships wrangler.toml with a placeholder database_id.
      # Create the D1 database on first run, then pin its id so that
      # migrations and deploy target the same database.
      - name: Ensure D1 database and apply migrations
        run: |
          cd worker
          DB_ID=$(npx -y "wrangler@${WRANGLER_VERSION}" d1 list --json | jq -r '.[] | select(.name == "vigil") | .uuid // empty')
          if [[ -z "$DB_ID" ]]; then
            echo "Creating D1 database 'vigil'..."
            npx -y "wrangler@${WRANGLER_VERSION}" d1 create vigil
            DB_ID=$(npx -y "wrangler@${WRANGLER_VERSION}" d1 list --json | jq -r '.[] | select(.name == "vigil") | .uuid // empty')
          fi
          if [[ -z "$DB_ID" ]]; then
            echo "Could not find or create D1 database 'vigil'!"
            exit 1
          fi
          echo "D1 database id: $DB_ID"
          sed -i -E "s/^database_id = .*$/database_id = \"$DB_ID\"/" wrangler.toml
          npx -y "wrangler@${WRANGLER_VERSION}" d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Optional: seeds the site config from the SITE_YAML secret.
      # Skipped unless the secret is set (then the EDITOR=true editor flow
      # is the alternative). When set, this is the source of truth: it
      # overwrites the D1 value on every deploy, so editor edits made
      # between deploys get replaced. The YAML is syntax-checked here;
      # full validation (Site::check) happens in the worker at load.
      - name: Seed site config from SITE_YAML secret
        run: |
          cd worker
          if [ -z "$SITE_YAML" ]; then
            echo "SITE_YAML not set, skipping (seed via the EDITOR=true editor flow instead)."
            exit 0
          fi
          printf '%s' "$SITE_YAML" > /tmp/site.yaml
          python3 - <<'EOF'
          import sys
          raw = open('/tmp/site.yaml', encoding='utf-8').read()
          if not raw.strip():
              sys.exit('SITE_YAML is blank, refusing to overwrite the saved config')
          try:
              import yaml
          except ImportError:
              sys.exit('pyyaml missing: refusing to seed without a syntax check')
          else:
              yaml.safe_load(raw)
              print('site YAML syntax ok')
          escaped = raw.replace("'", "''")
          open('/tmp/seed_site.sql', 'w', encoding='utf-8').write(
              "INSERT INTO kv (k, v) SELECT 'site_yaml_prev', v FROM kv WHERE k = 'site_yaml' "
              "ON CONFLICT(k) DO UPDATE SET v = excluded.v;\n"
              "INSERT INTO kv (k, v) VALUES ('site_yaml', '"
              + escaped
              + "') ON CONFLICT(k) DO UPDATE SET v = excluded.v;\n"
          )
          EOF
          npx -y "wrangler@${WRANGLER_VERSION}" d1 execute DB --remote --file=/tmp/seed_site.sql
          rm -f /tmp/site.yaml /tmp/seed_site.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_YAML: ${{ secrets.SITE_YAML }}

      # Fail before deploying an auth config that has no usable password:
      # the Worker fails closed, but a misconfigured deploy would lock the
      # site out. Cleartext `pass` is checked too; `pass_env` values other
      # than STATUS_PASSWORD are managed by the operator elsewhere.
      - name: Refuse auth config without a password
        run: |
          cd worker
          npx -y "wrangler@${WRANGLER_VERSION}" d1 execute DB --remote --json \
            --command "SELECT v FROM kv WHERE k = 'site_yaml'" > /tmp/site_config.json
          python3 - <<'PY'
          import json, os, sys

          data = json.load(open("/tmp/site_config.json", encoding="utf-8"))
          rows = []
          for block in data if isinstance(data, list) else [data]:
              if isinstance(block, dict) and isinstance(block.get("results"), list):
                  rows.extend(block["results"])
          if not rows or not rows[0].get("v"):
              print("No saved site config; skipping auth check.")
              sys.exit(0)

          try:
              import yaml
          except ImportError:
              sys.exit("pyyaml missing: cannot verify auth config before deploy")

          site = yaml.safe_load(rows[0]["v"])
          auth = site.get("auth") if isinstance(site, dict) else None
          if auth is None:
              print("No auth gate configured.")
              sys.exit(0)
          if not isinstance(auth, dict):
              sys.exit("auth must be a mapping")

          user = auth.get("user")
          if not isinstance(user, str) or not user.strip() or ":" in user:
              sys.exit("auth.user must be a non-empty string without ':'")

          cleartext = auth.get("pass")
          env_name = auth.get("pass_env")
          if (cleartext is None) == (env_name is None):
              sys.exit("auth must set exactly one of pass or pass_env")
          if cleartext is not None and not cleartext:
              sys.exit("auth.pass is empty")
          if env_name is not None and not env_name:
              sys.exit("auth.pass_env is empty")

          if env_name == "STATUS_PASSWORD" and not os.environ.get("STATUS_PASSWORD"):
              sys.exit("auth references STATUS_PASSWORD but the repo secret is empty/unset; set it or remove auth")
          print("Auth config has a usable password source.")
          PY
          rm -f /tmp/site_config.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STATUS_PASSWORD: ${{ secrets.STATUS_PASSWORD }}

      # Optional: enables Basic auth on the status page (Gate + STATUS_PASSWORD).
      # Removing the repo secret deletes the worker secret (rather than
      # leaving an old password valid); the Worker then fails closed if the
      # saved config still references it. printf avoids echo option parsing
      # for passwords like "-n".
      - name: Set STATUS_PASSWORD secret
        run: |
          cd worker
          if [ -z "$STATUS_PASSWORD" ]; then
            OUT=$(npx -y "wrangler@${WRANGLER_VERSION}" secret delete STATUS_PASSWORD 2>&1) || {
              echo "$OUT"
              if echo "$OUT" | grep -qiE 'not found|does not exist|not present'; then
                echo "STATUS_PASSWORD already absent."
              else
                exit 1
              fi
            }
          else
            printf '%s' "$STATUS_PASSWORD" | npx -y "wrangler@${WRANGLER_VERSION}" secret put STATUS_PASSWORD
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STATUS_PASSWORD: ${{ secrets.STATUS_PASSWORD }}

      # GitHub secrets never reach the worker on their own: sync the
      # EDITOR repo secret into the EDITOR worker secret so editor mode
      # can be driven from GitHub. Set the repo secret to exactly `true`
      # to take the site offline into the editor; delete (or empty) the
      # repo secret and re-run to remove the worker secret and restore
      # the site. A stale EDITOR=true would keep the live site offline,
      # so the unset path deletes rather than skips.
      - name: Sync EDITOR flag from GitHub secret
        run: |
          cd worker
          if [ -z "$EDITOR" ]; then
            OUT=$(npx -y "wrangler@${WRANGLER_VERSION}" secret delete EDITOR 2>&1) || {
              echo "$OUT"
              if echo "$OUT" | grep -qiE 'not found|does not exist|not present'; then
                echo "EDITOR already absent."
              else
                exit 1
              fi
            }
          elif [ "$EDITOR" = "true" ]; then
            if [ -z "$EDITOR_TOKEN" ]; then
              echo "EDITOR=true requires the EDITOR_TOKEN repo secret — refusing to expose an unauthenticated editor."
              exit 1
            fi
            if [ "${#EDITOR_TOKEN}" -lt 16 ]; then
              echo "EDITOR_TOKEN must be at least 16 characters."
              exit 1
            fi
            printf '%s' "$EDITOR" | npx -y "wrangler@${WRANGLER_VERSION}" secret put EDITOR
          else
            echo "EDITOR repo secret must be exactly 'true' or empty (got something else) — refusing to sync."
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EDITOR: ${{ secrets.EDITOR }}
          EDITOR_TOKEN: ${{ secrets.EDITOR_TOKEN }}

      # Keep the editor token in sync too; a stale token must not linger
      # after editor mode is turned off.
      - name: Sync EDITOR_TOKEN secret
        run: |
          cd worker
          if [ -n "$EDITOR_TOKEN" ]; then
            printf '%s' "$EDITOR_TOKEN" | npx -y "wrangler@${WRANGLER_VERSION}" secret put EDITOR_TOKEN
          else
            OUT=$(npx -y "wrangler@${WRANGLER_VERSION}" secret delete EDITOR_TOKEN 2>&1) || {
              echo "$OUT"
              if echo "$OUT" | grep -qiE 'not found|does not exist|not present'; then
                echo "EDITOR_TOKEN already absent."
              else
                exit 1
              fi
            }
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EDITOR_TOKEN: ${{ secrets.EDITOR_TOKEN }}

      - name: Deploy worker
        run: |
          cd worker
          npx -y "wrangler@${WRANGLER_VERSION}" deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
