name = "vigil"
main = "build/worker/shim.mjs"
compatibility_date = "2025-04-02"

# Workers Caching: consult the edge cache for public GET responses before
# running the Worker. Without this block, Cache-Control only reaches
# browsers and every tab poll/reload still pays D1 rows-read.
[cache]
enabled = true

[build]
command = "cargo install -q worker-build && worker-build --release"

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "vigil"
database_id = "51432d2d-16f5-4722-96c6-a395cffb4d3d"

[vars]
# Optional: set via `wrangler secret put` instead for real passwords.
# STATUS_PASS_ENV = "STATUS_PASSWORD"
# Config editor: set EDITOR = "true" (and redeploy) to replace the status
# site with a copy-paste YAML editor that stores the config in D1.
# The site, APIs, and cron probes stay offline until EDITOR is REMOVED
# and the worker is redeployed — never leave it on.
# EDITOR = "true"
