[package]
name = "vigil-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
vigil = { path = "../config" }
vigil-core = { path = "../core" }
worker = { version = "0.8", features = ["d1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
futures-util = "0.3"
wasm-bindgen = "0.2"
url = "2"

[dev-dependencies]
# Bundled-SQLite harness executing the shipped query text: D1 is SQLite
# but unit tests have no D1, and an untested modulo predicate once emptied
# every detail chart in production.
rusqlite = { version = "0.31", features = ["bundled"] }



